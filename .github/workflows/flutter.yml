name: Flutter checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter test --platform chrome test/web_theme_test.dart test/web_storage_test.dart
      # API_BASE comes from a repository/environment variable; empty → offline demo build.
      - run: bash tool/build_web.sh
        env:
          API_BASE: ${{ vars.API_BASE }}
      - run: flutter build apk --release --dart-define=API_BASE=${{ vars.API_BASE }}
        env:
          SOOQNA_KEYSTORE_PATH: ${{ secrets.SOOQNA_KEYSTORE_PATH }}
          SOOQNA_KEYSTORE_PASSWORD: ${{ secrets.SOOQNA_KEYSTORE_PASSWORD }}
          SOOQNA_KEY_ALIAS: ${{ secrets.SOOQNA_KEY_ALIAS }}
          SOOQNA_KEY_PASSWORD: ${{ secrets.SOOQNA_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: advertising-demo-builds
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/web/
